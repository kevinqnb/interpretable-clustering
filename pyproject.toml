[project]
name = "intercluster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.4"
dependencies = [
    "cython>=3.2.2",
    "exkmc",
    "geopandas>=1.1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "mdlp-discretization",
    "networkx>=3.6",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pyarc>=1.1.4",
    "pyclustering>=0.10.1.2",
    "pyids",
    "pytest>=9.0.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "shallowtree>=0.0.11",
    "ucimlrepo>=0.0.7",
    "wheel>=0.45.1",
]


[build-system]
requires = ["setuptools", "cython", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.extra-build-dependencies]
exkmc = ["numpy"]

[tool.uv.sources]
exkmc = { git = "https://github.com/kevinqnb/ExKMC.git" }
pyids = { git = "https://github.com/kevinqnb/pyIDS.git" }
mdlp-discretization = { git = "https://github.com/kevinqnb/mdlp-discretization.git" }
