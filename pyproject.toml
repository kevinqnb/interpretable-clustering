[project]
name = "intercluster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.4"
dependencies = [
    "cython>=3.2.2",
    "exkmc",
    "geopandas>=1.1.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.7",
    "mdlp-discretization",
    "networkx>=3.6",
    "numpy>=2.3.5",
    "orange3>=3.39.0",
    "pandas>=2.3.3",
    "pyarc>=1.1.4",
    "pyclustering>=0.10.1.2",
    "pytest>=9.0.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "shallowtree>=0.0.11",
    "ucimlrepo>=0.0.7",
    "wheel>=0.45.1",
]

[build-system]
requires = ["setuptools", "cython", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.extra-build-dependencies]
exkmc = ["numpy"]

[tool.uv.sources]
# Vendored, patched copies of two unmaintained packages that no longer build against
# modern numpy/scikit-learn/Python
exkmc = { path = "third_party/exkmc" }
mdlp-discretization = { path = "third_party/mdlp_discretization" }

# pyids is deliberately NOT declared as a dependency (in [project.dependencies], an
# optional-dependencies extra, or here): pyids is only used by two tests in
# tests/decision_sets/test_ids.py that cross-check the from-scratch IDS
# reimplementation in src/intercluster/decision_sets/ids.py against it; those tests
# skip themselves if pyids isn't importable. To run them, install it manually. 
# Note that this is anonymized since we forked the repo to update unmaintained dependency issues. 
#     uv pip install git+https://github.com/kevinqnb/pyIDS.git
